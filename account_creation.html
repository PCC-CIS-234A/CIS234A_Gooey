<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Portland Community College Food Pantry | Account Creation</title>

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=visibility" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=visibility_off" />

	<link rel="stylesheet" href="styles.css">

	<script src="script.js" defer></script>
</head>

<body>
	<nav>
		<ul>
			<li><a href="account_creation.html">Account Creation</a></li>
			<li><a href="login.html">Log In</a></li>
			<li>Notification</li>
			<li>Template</li>
			<li>Log Review</li>
		</ul>
	</nav>
	<main class="account-page">
		<header class="page-header">
			<h1>Portland Community College Food Pantry</h1>
			<p>Account Creation</p>
		</header>
		
		<form class="account-form">
			<div class="field">
				<label for="fname">First Name</label>
				<input type="text" id="fname" name="fname">
			</div>
				
			<div class="field">
				<label for="lname">Last Name</label>
				<input type="text" id="lname" name="lname">
			</div>
			
			<div class="field">
				<label for="username">Username</label>
				<input type="text" id="username" name="username">
			</div>
			
			<div class="field">
				<label for="email">E-mail Address</label>
				<input type="text" id="email" name="email">
				<small>Example: username@pcc.edu</small>
			</div>
			
			<div class="field">
				<label for="pword">Password</label>
				<small>(Minimum 8 characters and 1 Number)</small>
				
				<div class="password-wrapper">
					<input type="password" id="pword" name="pword">
					<button type="button" class="visibility-toggle">
						<span class="material-symbols-outlined">
							visibility
						</span>
					</button>
				</div>
				
				<small class="strength">Strength [ &nbsp;&nbsp;&nbsp; ]</small>
			</div>
			
			<div class="field">
				<label for="cpword">Confirm Password</label>
				
				<div class="password-wrapper">
					<input type="password" id="cpword" name="cpword">
					<button class="visibility-toggle">
						<span class="material-symbols-outlined">
							visibility
						</span>
					</button>
				</div>
			</div>
			
			<div class="form-actions">
				<button type="submit">Create Account</button>
				<a class="back-button" href="login.html">Back to Login</a>
				<button type="reset">Clear/Cancel</button>
			</div>
		</form>
	</main>
</body>
</html>
